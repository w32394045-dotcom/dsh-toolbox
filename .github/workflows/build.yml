name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]   # ARM64 runner：真机验证架构判定与 anycpu 构建
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Roslyn 编译器
        shell: pwsh
        run: ./tools/fetch-roslyn.ps1

      - name: 构建 dsh-toolbox.exe
        shell: pwsh
        run: ./build.ps1

      - name: 自检与验收（44 项）
        shell: pwsh
        run: ./verify.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-toolbox-exe
          path: dist/dsh-toolbox.exe
          if-no-files-found: error

      - name: 架构与适配信息（真机核对 hostArch/nodeTag/代理探测）
        shell: pwsh
        run: |
          $exe = './dist/dsh-toolbox.exe'
          $j = (& $exe install.prereq --fast --json --quiet | Out-String).Trim() | ConvertFrom-Json
          Write-Host "runner      = ${{ matrix.os }}"
          Write-Host "OS          = $([System.Environment]::OSVersion.VersionString)  x64=$([System.Environment]::Is64BitOperatingSystem)"
          Write-Host "PROCESSOR   = $env:PROCESSOR_ARCHITECTURE / ARCHW6432=$env:PROCESSOR_ARCHITEW6432"
          Write-Host "hostArch    = $($j.data.hostArch)   nodeTag=$($j.data.nodeTag)"
          Write-Host "proxy.source= $($j.data.proxy.source)"
          Write-Host "theme       = $((& $exe config.get --json --quiet | Out-String).Trim() | ConvertFrom-Json | ForEach-Object { $_.data.effectiveTheme })"
          $e = (& $exe compat.check --fast --json --quiet | Out-String).Trim() | ConvertFrom-Json
          $e.data.items | Where-Object { $_.id -in @('os','arch','dotnet') } | ForEach-Object { Write-Host "  [$($_.ok)] $($_.name): $($_.detail)" }

      - name: 命令清单（便于人工核对）
        shell: pwsh
        run: |
          ./dist/dsh-toolbox.exe manifest --json > manifest.json
          $m = Get-Content manifest.json -Raw | ConvertFrom-Json
          Write-Host "命令数: $($m.data.count)"
          Write-Host "分组数: $(($m.data.commands | Group-Object group).Count)"
