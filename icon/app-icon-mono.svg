<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="dsh-toolbox (monochrome)">
  <title>dsh-toolbox (monochrome)</title>
  <desc>单色剪影版：用于文档、托盘、通知等需要单色的场合；颜色继承 currentColor</desc>

  <g fill="currentColor" stroke="currentColor">
    <!-- 提手 -->
    <path d="M101 86 V75 a15 15 0 0 1 15-15 h24 a15 15 0 0 1 15 15 v11"
          fill="none" stroke-width="13" stroke-linecap="round"/>
    <!-- 箱盖 -->
    <rect x="52" y="90" width="152" height="34" rx="11" stroke="none"/>
    <!-- 箱体 -->
    <rect x="64" y="132" width="128" height="72" rx="15" stroke="none"/>
    <!-- 锁扣以镂空表现：白色在浅底上不易读，故单色版只保留盖体之间的缝隙 -->
  </g>
</svg>
