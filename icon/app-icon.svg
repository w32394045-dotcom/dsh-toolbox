<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="dsh-toolbox">
  <title>dsh-toolbox</title>
  <desc>DSH 工具箱应用图标：渐变圆角方砖 + 白色工具箱剪影</desc>

  <defs>
    <linearGradient id="tile" x1="26" y1="18" x2="230" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C9BFF"/>
      <stop offset="0.55" stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#7A5AF0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="128" y1="8" x2="128" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底砖 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>

  <!-- 提手 -->
  <path d="M101 86 V75 a15 15 0 0 1 15-15 h24 a15 15 0 0 1 15 15 v11"
        fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>

  <!-- 箱盖 -->
  <rect x="52" y="90" width="152" height="34" rx="11" fill="#FFFFFF"/>

  <!-- 锁扣：用底砖渐变挖空，跨越盖与体的缝隙 -->
  <rect x="115" y="116" width="26" height="30" rx="7" fill="url(#tile)"/>

  <!-- 箱体 -->
  <rect x="64" y="132" width="128" height="72" rx="15" fill="#FFFFFF"/>
</svg>
